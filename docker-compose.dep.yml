version: "3.8"
services:
  cache:
    image: redis:latest
    restart: unless-stopped
    container_name: cache
    env_file:
      - ./.env
    # Development dependency ports must only be reachable from this machine.
    ports:
      - "127.0.0.1:${CACHE_PORT}:6379"

  database:
    image: mysql:5.7
    container_name: database
    restart: always
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
