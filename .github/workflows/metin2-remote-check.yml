name: Metin2 server remote check

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/metin2-remote-check.yml"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metin2-remote-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout server source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Record runner environment
        run: |
          echo "Runner: $(uname -a)"
          node --version
          npm --version
          docker --version
          docker compose version

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Prepare isolated local config
        run: |
          cp .env.example .env
          sed -i 's/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=ci-only-password/' .env
          sed -i 's/^SEED_ADMIN_PASSWORD=.*/SEED_ADMIN_PASSWORD=ci-only-admin-password/' .env

      - name: Start MySQL and Redis dependencies
        run: |
          docker compose -f docker-compose.dep.yml up -d
          for i in $(seq 1 60); do
            if docker exec database mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password --silent; then
              echo "MySQL is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker logs database
              exit 1
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if docker exec cache redis-cli ping | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs cache
              exit 1
            fi
            sleep 2
          done

      - name: Print dependency status
        if: always()
        run: |
          docker ps -a || true
          docker logs database --tail 80 || true
          docker logs cache --tail 40 || true

      - name: Clean up services
        if: always()
        run: |
          docker compose -f docker-compose.dep.yml down -v || true
          rm -f .env
