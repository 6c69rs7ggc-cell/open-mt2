name: Metin2 server remote check

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metin2-remote-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout server source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Record runner environment
        run: |
          echo "Runner: $(uname -a)"
          node --version
          npm --version
          docker --version
          docker compose version

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Prepare isolated local config
        run: |
          cp .env.example .env
          sed -i 's/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=ci-only-password/' .env
          sed -i 's/^SEED_ADMIN_PASSWORD=.*/SEED_ADMIN_PASSWORD=ci-only-admin-password/' .env
          printf '\nREAL_SERVER_ADDRESS=127.0.0.1\nCACHE_PING_INTERVAL=30000\n' >> .env

      - name: Start MySQL and Redis dependencies
        run: |
          docker compose -f docker-compose.dep.yml up -d
          for i in $(seq 1 60); do
            if docker exec database mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password --silent; then
              echo "MySQL is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker logs database
              exit 1
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if docker exec cache redis-cli ping | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs cache
              exit 1
            fi
            sleep 2
          done

      - name: Run database migrations
        run: npm run migrate

      - name: Verify seeded database schema
        run: |
          docker exec database mysql -uroot -pci-only-password -N -e "SELECT COUNT(*) FROM auth.account WHERE username IN ('admin','admin1');"
          docker exec database mysql -uroot -pci-only-password -N -e "SHOW TABLES FROM game;"

      - name: Smoke test auth and game servers
        run: |
          npm run auth > /tmp/open-mt2-auth.log 2>&1 &
          AUTH_PID=$!
          npm run game > /tmp/open-mt2-game.log 2>&1 &
          GAME_PID=$!
          cleanup() {
            kill "$AUTH_PID" "$GAME_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for port in 11002 13001; do
            ready=0
            for i in $(seq 1 30); do
              if bash -c "echo > /dev/tcp/127.0.0.1/$port" 2>/dev/null; then
                echo "Server listening on $port"
                ready=1
                break
              fi
              if ! kill -0 "$AUTH_PID" 2>/dev/null && [ "$port" -eq 11002 ]; then
                cat /tmp/open-mt2-auth.log
                exit 1
              fi
              if ! kill -0 "$GAME_PID" 2>/dev/null && [ "$port" -eq 13001 ]; then
                cat /tmp/open-mt2-game.log
                exit 1
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              cat /tmp/open-mt2-auth.log
              cat /tmp/open-mt2-game.log
              exit 1
            fi
          done
          cat /tmp/open-mt2-auth.log
          cat /tmp/open-mt2-game.log

      - name: Print dependency status
        if: always()
        run: |
          docker ps -a || true
          docker logs database --tail 80 || true
          docker logs cache --tail 40 || true

      - name: Clean up services
        if: always()
        run: |
          docker compose -f docker-compose.dep.yml down -v || true
          rm -f .env
