name: Metin2 Client Build Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metin2-client-build.yml"

permissions:
  contents: read

jobs:
  build-client:
    runs-on: windows-latest
    steps:
      - name: Checkout ASHEN REALM repository
        uses: actions/checkout@v4

      - name: Checkout Metin2 client source
        uses: actions/checkout@v4
        with:
          repository: NakiuS/Metin2Client
          ref: master
          path: client-source

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply isolated compatibility fixes to checkout
        shell: pwsh
        run: |
          $header = "client-source/source/EterLib/GrpDetector.h"
          $source = Get-Content $header -Raw
          if ($source -notmatch '#include\s*[<"]string[>"]') {
            $source = '#include <string>' + "`r`n" + $source
            Set-Content -Path $header -Value $source -NoNewline
          }

          $jpeg = "client-source/source/EterLib/JpegFile.cpp"
          $source = Get-Content $jpeg -Raw
          $marker = 'void mem_init_source (j_decompress_ptr cinfo)'
          $index = $source.IndexOf($marker)
          if ($index -lt 0) { throw "Expected JPEG memory source functions not found" }
          $prefix = $source.Substring(0, $index)
          $tail = $source.Substring($index)
          $tail = [regex]::Replace($tail, '\bdata\b', 'jpegInputData')
          $tail = [regex]::Replace($tail, '\bsize\b', 'jpegInputSize')
          Set-Content -Path $jpeg -Value ($prefix + $tail) -NoNewline

      - name: Build 32-bit Release client with installed toolset
        shell: pwsh
        run: |
          msbuild client-source/client.sln /m /t:Build /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:LanguageStandard=stdcpp14 /p:RestorePackagesConfig=true /verbosity:minimal
