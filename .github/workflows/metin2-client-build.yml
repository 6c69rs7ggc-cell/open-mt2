name: Metin2 Client Build Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metin2-client-build.yml"

permissions:
  contents: read

jobs:
  build-client:
    runs-on: windows-latest
    steps:
      - name: Checkout ASHEN REALM repository
        uses: actions/checkout@v4

      - name: Checkout Metin2 client source
        uses: actions/checkout@v4
        with:
          repository: NakiuS/Metin2Client
          ref: master
          path: client-source

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply temporary compatibility fixes for modern MSVC
        shell: pwsh
        run: |
          $header = "client-source/source/eterLib/GrpDetector.h"
          if (Test-Path $header) {
            $source = Get-Content $header -Raw
            if ($source -notmatch '#include\s*[<"]string[>"]') {
              $source = $source -replace '(?m)^(#pragma once\s*)', ('$1' + "`r`n#include <string>")
              Set-Content -Path $header -Value $source -NoNewline
            }
          } else {
            throw "Expected legacy client header not found: $header"
          }

          $miles = "client-source/vs_files/MilesLib/MilesLib.vcxproj"
          [xml]$project = Get-Content $miles -Raw
          $nodes = $project.SelectNodes("//*[local-name()='PreprocessorDefinitions']")
          foreach ($node in $nodes) {
            if ($node.InnerText -notmatch 'WINDOWS_IGNORE_PACKING_MISMATCH') {
              $node.InnerText = "WINDOWS_IGNORE_PACKING_MISMATCH;" + $node.InnerText
            }
          }
          $project.Save((Resolve-Path $miles))

      - name: Build 32-bit Release client with installed toolset
        shell: pwsh
        run: |
          msbuild client-source/client.sln /m /t:Build /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:LanguageStandard=stdcpp14 /p:RestorePackagesConfig=true /verbosity:minimal
