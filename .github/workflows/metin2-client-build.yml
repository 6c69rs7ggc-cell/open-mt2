name: Metin2 Client Build Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metin2-client-build.yml"

permissions:
  contents: read

jobs:
  build-client:
    runs-on: windows-latest
    steps:
      - name: Checkout ASHEN REALM repository
        uses: actions/checkout@v4

      - name: Checkout Metin2 client source
        uses: actions/checkout@v4
        with:
          repository: NakiuS/Metin2Client
          ref: master
          path: client-source

      - name: Checkout Crypto++ source for missing static library
        uses: actions/checkout@v4
        with:
          repository: weidai11/cryptopp
          ref: CRYPTOPP_5_6_2
          path: cryptopp-source

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Crypto++ 5.6.2 static library
        shell: pwsh
        run: |
          if (-not (Test-Path "cryptopp-source/cryptest.sln")) { throw "Crypto++ 5.6.2 solution cryptest.sln was not found." }
          # Crypto++ 5.6.2 ships legacy Visual Studio 2005 .vcproj projects. Upgrade them before MSBuild.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $devenv = Join-Path $vsRoot "Common7\IDE\devenv.com"
          if (-not (Test-Path $devenv)) { throw "Visual Studio devenv.com was not found at $devenv" }
          & $devenv "cryptopp-source/cryptest.sln" /Upgrade
          if ($LASTEXITCODE -ne 0) { throw "Visual Studio could not upgrade the legacy Crypto++ 5.6.2 solution." }
          $cryptlibProject = "cryptopp-source/cryptlib.vcxproj"
          if (-not (Test-Path $cryptlibProject)) { throw "Crypto++ upgrade did not produce cryptlib.vcxproj." }
          msbuild $cryptlibProject /m /t:Build /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /verbosity:minimal
          $lib = "cryptopp-source/Win32/Output/Release/cryptlib.lib"
          if (-not (Test-Path $lib)) {
            $lib = Get-ChildItem "cryptopp-source" -Recurse -Filter cryptlib.lib | Where-Object { $_.FullName -match "Win32.*Release" } | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $lib -or -not (Test-Path $lib)) {
            throw "Crypto++ 5.6.2 static library was not produced; expected cryptlib.lib under Win32 Release output."
          }
          New-Item -ItemType Directory -Force -Path "client-source/extern/library" | Out-Null
          Copy-Item $lib "client-source/extern/library/Cryptopp_lib_release.lib" -Force
          if (-not (Test-Path "client-source/extern/library/Cryptopp_lib_release.lib")) {
            throw "Crypto++ library was not copied to the linker search directory."
          }

      - name: Apply isolated compatibility fixes to checkout
        shell: pwsh
        run: |
          $header = "client-source/source/EterLib/GrpDetector.h"
          $headerSource = Get-Content $header -Raw
          if ($headerSource -notmatch '#include\s*[<"]string[>"]') {
            $headerSource = '#include <string>' + "`r`n" + $headerSource
            Set-Content -Path $header -Value $headerSource -NoNewline
          }

          $jpeg = "client-source/source/EterLib/JpegFile.cpp"
          $jpegSource = Get-Content $jpeg -Raw
          $jpegSource = [regex]::Replace($jpegSource, '\bdata\b', 'jpegInputData')
          $jpegSource = [regex]::Replace($jpegSource, '\bsize\b', 'jpegInputSize')
          Set-Content -Path $jpeg -Value $jpegSource -NoNewline

          $resource = "client-source/source/UserInterface/UserInterface.rc"
          $resourceSource = Get-Content $resource -Raw
          $resourceSource = $resourceSource.Replace('#include "afxres.h"', "#include <winres.h>`r`n#ifndef IDC_STATIC`r`n#define IDC_STATIC -1`r`n#endif")
          Set-Content -Path $resource -Value $resourceSource -NoNewline

          # SpherePack::LostChild is declared inline in the header but defined out-of-line
          # in spherepack.cpp; MSVC can omit the external symbol needed by EterLib.
          $sphereHeader = "client-source/source/SphereLib/spherepack.h"
          $sphereHeaderSource = Get-Content $sphereHeader -Raw
          $sphereHeaderSource = [regex]::Replace($sphereHeaderSource, '(?m)^([ \t]*)inline[ \t]+void[ \t]+LostChild\(SpherePack \*pack\);', '$1void LostChild(SpherePack *pack);')
          if ($sphereHeaderSource -notmatch '(?m)^\s*void LostChild\(SpherePack \*pack\);') { throw "Could not correct SpherePack::LostChild declaration." }
          Set-Content -Path $sphereHeader -Value $sphereHeaderSource -NoNewline

          # EterLib uses SpherePack symbols but upstream omits the SphereLib project reference.
          $eterProject = "client-source/vs_files/EterLib/EterLib.vcxproj"
          $eterSource = Get-Content $eterProject -Raw
          if ($eterSource -notmatch 'SphereLib.*SphereLib.vcxproj') {
            $sphereReference = '  <ItemGroup><ProjectReference Include="..\SphereLib\SphereLib.vcxproj"><Project>{B1F24BAE-61E8-41E9-B2BB-A6905E5D64FD}</Project><Private>false</Private><ReferenceOutputAssembly>false</ReferenceOutputAssembly><CopyLocalSatelliteAssemblies>false</CopyLocalSatelliteAssemblies><LinkLibraryDependencies>true</LinkLibraryDependencies><UseLibraryDependencyInputs>false</UseLibraryDependencyInputs></ProjectReference></ItemGroup>'
            $anchor = '  <Import Project="$(VCTargetsPath)\Microsoft.Cpp.targets" />'
            $eterSource = $eterSource.Replace($anchor, $sphereReference + "`r`n" + $anchor)
            Set-Content -Path $eterProject -Value $eterSource -NoNewline
          }

          # UserInterface is the final executable; explicitly link SphereLib because
          # static-library project references are not reliably propagated to the final link.
          $uiProject = "client-source/vs_files/UserInterface/UserInterface.vcxproj"
          $uiSource = Get-Content $uiProject -Raw
          if ($uiSource -notmatch 'SphereLib.*SphereLib.vcxproj') {
            $sphereUiReference = '  <ItemGroup><ProjectReference Include="..\SphereLib\SphereLib.vcxproj"><Project>{B1F24BAE-61E8-41E9-B2BB-A6905E5D64FD}</Project><Private>false</Private><ReferenceOutputAssembly>false</ReferenceOutputAssembly><CopyLocalSatelliteAssemblies>false</CopyLocalSatelliteAssemblies><LinkLibraryDependencies>true</LinkLibraryDependencies><UseLibraryDependencyInputs>false</UseLibraryDependencyInputs></ProjectReference></ItemGroup>'
            $uiAnchor = '  <Import Project="$(VCTargetsPath)\Microsoft.Cpp.targets" />'
            if (-not $uiSource.Contains($uiAnchor)) { throw "Could not locate UserInterface MSBuild targets import for SphereLib reference." }
            $uiSource = $uiSource.Replace($uiAnchor, $sphereUiReference + "`r`n" + $uiAnchor)
            Set-Content -Path $uiProject -Value $uiSource -NoNewline
          }

          # Force the final executable to link the concrete archives, not just rely on transitive project references.
          $releaseGroupPattern = '(?s)<ItemDefinitionGroup[^>]*Condition="[^"]*Release\|Win32[^"]*"[^>]*>.*?</ItemDefinitionGroup>'
          $releaseGroupMatch = [regex]::Match($uiSource, $releaseGroupPattern)
          if (-not $releaseGroupMatch.Success) { throw "Could not find Release|Win32 item definition group in UserInterface project." }
          $releaseGroup = $releaseGroupMatch.Value
          $linkPattern = '(?s)<Link>(.*?)</Link>'
          if ($releaseGroup -notmatch $linkPattern) { throw "Could not find Link section in Release|Win32 item definition group." }
          $linkReplacement = '<Link>' + "`r`n      <AdditionalDependencies>" + '$(SolutionDir)vs_files\SphereLib\Release\SphereLib.lib;$(SolutionDir)extern\library\Cryptopp_lib_release.lib;%(AdditionalDependencies)</AdditionalDependencies>' + '$1</Link>'
          $releaseGroup = [regex]::Replace($releaseGroup, $linkPattern, $linkReplacement, 1)
          if ($releaseGroup -notmatch [regex]::Escape('$(SolutionDir)vs_files\SphereLib\Release\SphereLib.lib') -or $releaseGroup -notmatch [regex]::Escape('$(SolutionDir)extern\library\Cryptopp_lib_release.lib')) {
            throw "Explicit SphereLib/Crypto++ dependencies were not inserted into the Release linker settings."
          }
          Write-Host "Release linker will use SphereLib.lib and Crypto++ 5.6.2, matching the bundled Crypto++ headers."
          $uiSource = $uiSource.Substring(0, $releaseGroupMatch.Index) + $releaseGroup + $uiSource.Substring($releaseGroupMatch.Index + $releaseGroupMatch.Length)
          Set-Content -Path $uiProject -Value $uiSource -NoNewline

          # Legacy libjpeg expects the pre-UCRT __iob_func symbol.
          $jpegCompat = "client-source/source/EterLib/JpegFile.cpp"
          $jpegCompatSource = Get-Content $jpegCompat -Raw
          if ($jpegCompatSource -notmatch '__iob_func') {
            $jpegCompatSource += "`r`n#include <stdio.h>`r`n" + 'extern "C" FILE __iob_func[3] = { *stdin, *stdout, *stderr };' + "`r`n"
            Set-Content -Path $jpegCompat -Value $jpegCompatSource -NoNewline
          }

          $miles = "client-source/vs_files/MilesLib/MilesLib.vcxproj"
          $projectSource = Get-Content $miles -Raw
          if ($projectSource -notmatch 'WINDOWS_IGNORE_PACKING_MISMATCH') {
            $projectSource = [regex]::Replace($projectSource, '<PreprocessorDefinitions>', '<PreprocessorDefinitions>WINDOWS_IGNORE_PACKING_MISMATCH;')
            Set-Content -Path $miles -Value $projectSource -NoNewline
          }

      - name: Build 32-bit Release client with installed toolset
        shell: pwsh
        run: |
          msbuild client-source/client.sln /m /t:Build /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:LanguageStandard=stdcpp14 /p:RestorePackagesConfig=true /verbosity:minimal

      - name: Verify and upload Metin2 client executable
        uses: actions/upload-artifact@v4
        with:
          name: Metin2Release-Win32
          path: client-source/binary/Metin2Release.exe
          if-no-files-found: error
          retention-days: 14
